<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" role="img"><text x="20" y="26" text-anchor="start" class="b">~보다 더 …: 비교급 + than</text><rect x="60" y="120" width="60" height="80" rx="8" class="chip"/><text x="90" y="220" text-anchor="middle" class="sm">나</text><rect x="150" y="70" width="60" height="130" rx="8" class="acc"/><text x="180" y="220" text-anchor="middle" class="sm">형</text><line x1="40" y1="200" x2="240" y2="200" class="ln"/><text x="30" y="250" text-anchor="start" class="b">My brother is taller than me.</text><rect x="280" y="44" width="340" height="50" rx="10" class="box"/><text x="450" y="70" text-anchor="middle">짧은 말 -er:  tall → taller · big → bigger</text><rect x="280" y="104" width="340" height="50" rx="10" class="box"/><text x="450" y="130" text-anchor="middle">긴 말 more:  more expensive</text><rect x="280" y="164" width="340" height="50" rx="10" class="warn"/><text x="450" y="190" text-anchor="middle">불규칙:  good → better · bad → worse</text></svg>
