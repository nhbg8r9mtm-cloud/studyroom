<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"><text x="20" y="26" text-anchor="start" class="b">미터 읽기 (dB)</text><rect x="120" y="22" width="46" height="18" rx="4" class="badf"/><text x="176" y="36" text-anchor="start" class="sm bt">0을 넘으면 클리핑(소리 깨짐)</text><rect x="120" y="40" width="46" height="260" rx="4" class="chip"/><rect x="120" y="83.3333" width="46" height="34.6667" rx="0" class="good"/><line x1="110" y1="66" x2="176" y2="66" class="as"/><line x1="110" y1="40" x2="120" y2="40" class="ln"/><text x="104" y="45" text-anchor="end" class="sm mu">0</text><line x1="110" y1="66" x2="120" y2="66" class="ln"/><text x="104" y="71" text-anchor="end" class="sm mu">-6</text><line x1="110" y1="92" x2="120" y2="92" class="ln"/><text x="104" y="97" text-anchor="end" class="sm mu">-12</text><line x1="110" y1="118" x2="120" y2="118" class="ln"/><text x="104" y="123" text-anchor="end" class="sm mu">-18</text><line x1="110" y1="144" x2="120" y2="144" class="ln"/><text x="104" y="149" text-anchor="end" class="sm mu">-24</text><line x1="110" y1="213.333" x2="120" y2="213.333" class="ln"/><text x="104" y="218.333" text-anchor="end" class="sm mu">-40</text><line x1="110" y1="300" x2="120" y2="300" class="ln"/><text x="104" y="305" text-anchor="end" class="sm mu">-60</text><text x="186" y="71" text-anchor="start" class="sm at">Stereo Out 피크 약 -6 dB: 여유 있는 출발점</text><text x="186" y="105.667" text-anchor="start" class="sm gt">트랙 하나 피크 약 -18 ~ -10 dB</text><text x="186" y="218.333" text-anchor="start" class="sm mu">너무 작으면 Gain으로 키우기</text><text x="20" y="326" text-anchor="start" class="sm">페이더 0 dB = 원래 크기 그대로 · 출발점일 뿐 정답은 아니에요</text></svg>
