">play</text><rect x="519" y="112" width="85" height="32" rx="8" class="chip"/><text x="561.5" y="133" text-anchor="middle">guitar?</text><text x="330" y="168" text-anchor="start" class="sm mu">-s는 does가 가져가요 (plays → play)</text><text x="20" y="206" text-anchor="start">부정:  I don't play.  /  She doesn't play.</text></svg>
