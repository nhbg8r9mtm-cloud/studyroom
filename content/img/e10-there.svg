<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" role="img"><text x="20" y="26" text-anchor="start" class="b">~이 있어요: 하나면 is, 여럿이면 are</text><rect x="20" y="40" width="290" height="130" rx="10" class="box"/><path d="M 150 60 h 26 l -4 34 h -18 z" class="acc"/><text x="165" y="130" text-anchor="middle" class="b">There is a cup.</text><text x="165" y="154" text-anchor="middle" class="sm mu">컵이 하나 있어요</text><rect x="330" y="40" width="290" height="130" rx="10" class="box"/><path d="M 430 60 h 26 l -4 34 h -18 z" class="acc"/><path d="M 462 60 h 26 l -4 34 h -18 z" class="acc"/><path d="M 494 60 h 26 l -4 34 h -18 z" class="acc"/><text x="475" y="130" text-anchor="middle" class="b">There are three cups.</text><text x="475" y="154" text-anchor="middle" class="sm mu">컵이 세 개 있어요</text><text x="20" y="198" text-anchor="start" class="sm">없을 때: There isn't / aren't ~   ·   물을 때: Is there ~? / Are there ~?</text></svg>
