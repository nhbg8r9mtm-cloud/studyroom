<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img"><rect x="20" y="20" width="290" height="120" rx="10" class="soft"/><text x="165" y="46" text-anchor="middle" class="b at">할 수 있다 (능력)</text><text x="165" y="70" text-anchor="middle" class="sm">I can swim.  수영할 수 있어요</text><text x="165" y="91" text-anchor="middle" class="sm">I can't swim.  수영 못 해요</text><rect x="330" y="20" width="290" height="120" rx="10" class="good"/><text x="475" y="46" text-anchor="middle" class="b gt">부탁·허락 묻기</text><text x="475" y="70" text-anchor="middle" class="sm">Can you help me?  도와줄래요?</text><text x="475" y="91" text-anchor="middle" class="sm">Can I sit here?  앉아도 돼요?</text><text x="20" y="172" text-anchor="start">can + 동사원형:  He can sing. ✓    He can sings. ✗</text></svg>
