<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img"><rect x="40" y="20" width="170" height="400" rx="12" class="chip"/><text x="125" y="46" text-anchor="middle" class="sm b">오디오 FX</text><rect x="54" y="54" width="142" height="24" rx="5" class="box"/><text x="125" y="71" text-anchor="middle" class="sm">Channel EQ</text><rect x="54" y="84" width="142" height="24" rx="5" class="box"/><text x="125" y="101" text-anchor="middle" class="sm">Compressor</text><text x="125" y="144" text-anchor="middle" class="sm b">센드</text><rect x="54" y="152" width="142" height="24" rx="5" class="box"/><text x="125" y="169" text-anchor="middle" class="sm">버스 1</text><text x="125" y="208" text-anchor="middle" class="sm b">출력</text><rect x="54" y="216" width="142" height="24" rx="5" class="box"/><text x="125" y="233" text-anchor="middle" class="sm">Stereo Out</text><circle cx="125" cy="268" r="16" class="box"/><line x1="125" y1="268" x2="135" y2="256" class="as"/><text x="125" y="300" text-anchor="middle" class="sm">팬</text><rect x="100" y="312" width="10" height="86" rx="3" class="box"/><rect x="92" y="344" width="26" height="14" rx="3" class="acc"/><rect x="144" y="312" width="10" height="86" rx="3" class="box"/><rect x="144" y="352" width="10" height="46" rx="3" class="good"/><rect x="54" y="404" width="30" height="10" rx="3" class="box"/><rect x="166" y="404" width="30" height="10" rx="3" class="box"/><line x1="230" y1="40" x2="230" y2="400" class="ln"/><polygon points="230,400 226.085,391.896 233.915,391.896" class="mu"/><text x="240" y="36" text-anchor="start" class="sm mu">↓ 소리는 위에서 아래로 지나가요</text><line x1="216" y1="66" x2="300" y2="66" class="dash"/><text x="306" y="71" text-anchor="start" class="sm">오디오 FX: 플러그인(EQ·컴프레서)을 꽂는 칸, 위 칸부터 차례로</text><line x1="216" y1="164" x2="300" y2="164" class="dash"/><text x="306" y="169" text-anchor="start" class="sm">센드: 소리 일부를 리버브 버스로 보내는 칸</text><line x1="216" y1="228" x2="300" y2="228" class="dash"/><text x="306" y="233" text-anchor="start" class="sm">출력: 소리가 나가는 곳 (보통 Stereo Out)</text><line x1="216" y1="272" x2="300" y2="272" class="dash"/><text x="306" y="277" text-anchor="start" class="sm">팬 노브: 왼쪽 ↔ 오른쪽 위치</text><line x1="216" y1="350" x2="300" y2="350" class="dash"/><text x="306" y="355" text-anchor="start" class="sm">볼륨 페이더(왼쪽)와 미터(오른쪽): 크기 조절·표시</text><line x1="216" y1="412" x2="300" y2="412" class="dash"/><text x="306" y="417" text-anchor="start" class="sm">M 뮤트(끄기) · S 솔로(이것만 듣기)</text></svg>
