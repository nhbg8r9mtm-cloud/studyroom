<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img"><rect x="20" y="20" width="190" height="130" rx="10" class="box"/><text x="115" y="46" text-anchor="middle" class="b">a + 자음 소리</text><text x="115" y="70" text-anchor="middle" class="sm">a book</text><text x="115" y="91" text-anchor="middle" class="sm">a car</text><text x="115" y="112" text-anchor="middle" class="sm">a cup</text><rect x="225" y="20" width="190" height="130" rx="10" class="soft"/><text x="320" y="46" text-anchor="middle" class="b at">an + 모음 소리</text><text x="320" y="70" text-anchor="middle" class="sm">an apple</text><text x="320" y="91" text-anchor="middle" class="sm">an orange</text><text x="320" y="112" text-anchor="middle" class="sm">an hour (h 소리 없음)</text><rect x="430" y="20" width="190" height="130" rx="10" class="good"/><text x="525" y="46" text-anchor="middle" class="b gt">여럿이면 -s / -es</text><text x="525" y="70" text-anchor="middle" class="sm">two books</text><text x="525" y="91" text-anchor="middle" class="sm">three boxes</text><text x="525" y="112" text-anchor="middle" class="sm">many cars</text><text x="20" y="185" text-anchor="start" class="b">자주 쓰는 예외</text><text x="20" y="212" text-anchor="start" class="sm">man → men · woman → women · child → children · person → people</text></svg>
