<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img"><text x="20" y="26" text-anchor="start" class="b">일반동사의 과거</text><line x1="40" y1="60" x2="600" y2="60" class="ln"/><polygon points="600,60 591.896,63.9147 591.896,56.0853" class="mu"/><circle cx="170" cy="60" r="8" class="acc"/><text x="170" y="86" text-anchor="middle" class="sm at">어제 (과거)</text><circle cx="470" cy="60" r="8" class="chip"/><text x="470" y="86" text-anchor="middle" class="sm mu">지금</text><rect x="20" y="104" width="290" height="110" rx="10" class="soft"/><text x="165" y="130" text-anchor="middle" class="b at">규칙: 동사 + -ed</text><text x="165" y="154" text-anchor="middle" class="sm">play → played</text><text x="165" y="175" text-anchor="middle" class="sm">work → worked</text><rect x="330" y="104" width="290" height="110" rx="10" class="warn"/><text x="475" y="130" text-anchor="middle" class="b wt">불규칙 (외우기)</text><text x="475" y="154" text-anchor="middle" class="sm">go → went · eat → ate</text><text x="475" y="175" text-anchor="middle" class="sm">see → saw · buy → bought</text><text x="20" y="244" text-anchor="start">부정·질문은 did + 동사원형:  I didn't go.  /  Did you go?</text></svg>
