<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"><text x="20" y="26" text-anchor="start" class="b">일반동사: 한 사람·하나(he·she·it)면 -s</text><rect x="20" y="44" width="200" height="46" rx="10" class="chip"/><text x="120" y="73" text-anchor="middle">I · you · we · they</text><line x1="226" y1="67" x2="266" y2="67" class="as"/><polygon points="266,67 257.896,70.9147 257.896,63.0853" class="acc"/><rect x="274" y="44" width="90" height="46" rx="10" class="box"/><text x="319" y="74" text-anchor="middle" class="lg">like</text><text x="384" y="73" text-anchor="start" class="mu">I like coffee.</text><rect x="20" y="108" width="200" height="46" rx="10" class="chip"/><text x="120" y="137" text-anchor="middle">he · she · it</text><line x1="226" y1="131" x2="266" y2="131" class="as"/><polygon points="266,131 257.896,134.915 257.896,127.085" class="acc"/><rect x="274" y="108" width="90" height="46" rx="10" class="box"/><text x="306" y="138" text-anchor="middle" class="lg">like</text><rect x="334" y="116" width="24" height="30" rx="6" class="acc"/><text x="346" y="138" text-anchor="middle" class="inv b lg">s</text><text x="384" y="137" text-anchor="start" class="mu">She likes music.</text><text x="20" y="186" text-anchor="start" class="sm">go → goes · watch → watches · study → studies · have → has</text></svg>
